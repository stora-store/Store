      display: flex;
      align-items: center;
      max-width: 100%;
    }
    .scrollable-container-wrapper::after {
      content: "‹";
      position: absolute;
      left: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--gold);
      color: #111827;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      animation: bounce-arrow 1.5s infinite;
      pointer-events: none;
      z-index: 10;
    }
    [dir="ltr"] .scrollable-container-wrapper::after { content: "›"; left: auto; right: 6px; }

    @keyframes bounce-arrow {
      0%, 100% { transform: translateY(-50%) translateX(0); }
      50% { transform: translateY(-50%) translateX(-4px); }
    }

    .normal-frame-group {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 8px 12px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      max-width: 100%;
      padding-left: 35px;
    }
    [dir="ltr"] .normal-frame-group { padding-left: 12px; padding-right: 35px; }
    .normal-frame-group::-webkit-scrollbar { display: none; }

    .cat-item {

      border-radius: 12px;
      padding: 6px 8px;
      background: #fff;

    .cat-item:hover { transform: translateY(-3px); border-color: var(--gold); }
    
    .cat-circle {

      box-shadow: 0 4px 15px rgba(17, 24, 39, 0.3);

      border-color: var(--gold) !important;
      background: var(--primary) !important;
    }
    .cat-item.active .cat-name {

      font-weight: 900 !important;
    }

    .cat-name { font-size: 0.72rem; font-weight: 900; color: var(--text); text-align: center; white-space: nowrap; }

      box-shadow: 0 0 10px rgba(197, 155, 39, 0.4);
    }
    .cat-item.highlight-cat:not(.active) .cat-name {

      font-weight: 900;
      font-size: 0.75rem;
    }
